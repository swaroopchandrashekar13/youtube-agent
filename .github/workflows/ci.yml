name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint, test, licenses (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install system ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # Same as the Docker image: no install scripts; only the native modules we need are built.
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm rebuild sqlite3 sharp

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
        env:
          FFMPEG_PATH: /usr/bin/ffmpeg
          FFPROBE_PATH: /usr/bin/ffprobe

      - name: License check
        run: npm run license:check

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        run: >
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo
          zricethezav/gitleaks:v8.28.0
          git --redact --no-banner --verbose /repo

  dry-run:
    name: Offline end-to-end dry run (fake providers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm rebuild sqlite3 sharp
          npx playwright install --with-deps chromium

      - name: Dry run
        run: npm run -s dry-run -- --out "$RUNNER_TEMP/dry-run" | tee "$RUNNER_TEMP/dry-run-summary.log"
        env:
          FFMPEG_PATH: /usr/bin/ffmpeg
          FFPROBE_PATH: /usr/bin/ffprobe

      - name: Job mode smoke test (exit codes and idempotency)
        shell: bash
        run: |
          set +e
          expect() { "${@:2}"; code=$?; echo "exit=$code (expected $1): ${*:2}"; [ "$code" -eq "$1" ] || exit 1; }
          expect 10 npm run -s job -- --stage=generate --topic="CI smoke test" --length=short
          expect 10 npm run -s job -- --stage=generate --topic="CI smoke test" --length=short
          expect 10 npm run -s job -- --stage=qa
          expect 0  npm run -s job -- --stage=publish
          expect 30 npm run -s job -- --stage=nope
        env:
          PROVIDERS_MODE: fake
          DATABASE_PATH: ${{ runner.temp }}/job-smoke/db.sqlite
          JOB_LEASE_DIR: ${{ runner.temp }}/job-smoke/leases
          FAKE_YOUTUBE_DIR: ${{ runner.temp }}/job-smoke/youtube
          FFMPEG_PATH: /usr/bin/ffmpeg
          FFPROBE_PATH: /usr/bin/ffprobe

      - name: Upload dry-run output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dry-run
          path: |
            ${{ runner.temp }}/dry-run/final.mp4
            ${{ runner.temp }}/dry-run/fake-youtube/calls.jsonl
            ${{ runner.temp }}/dry-run-summary.log
          if-no-files-found: warn
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --omit=dev --audit-level=moderate

  docker:
    name: Docker image (amd64 build + container smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: yt-agent:ci
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64
      - name: Image checks
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker run --rm --entrypoint id yt-agent:ci -u)" = "10001"
          docker run --rm --entrypoint sh yt-agent:ci -c 'fc-list | grep -q "Noto Sans Kannada" && ffmpeg -hide_banner -filters | grep -q subtitles && test ! -e .env && test ! -e config/credentials.json'
          set +e
          docker run --rm --init yt-agent:ci; code=$?
          echo "no --stage -> exit $code"; test "$code" -eq 30
      - name: Container smoke test (fake providers)
        shell: bash
        run: |
          set +e
          docker run --rm --init -e NODE_ENV=test -e PROVIDERS_MODE=fake yt-agent:ci \
            --stage=generate --topic="Container smoke test" --length=short | tee smoke.log
          code=${PIPESTATUS[0]}
          echo "generate exit $code (expected 10 = awaiting human review)"
          test "$code" -eq 10

  docker-arm64:
    name: Docker image (arm64 build via QEMU)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Build arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: yt-agent:arm64
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
      - name: Native modules load on arm64
        run: >
          docker run --rm --platform linux/arm64 --entrypoint node yt-agent:arm64
          -e "require('sqlite3'); require('sharp'); console.log(process.arch, 'native modules ok')"
